    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist.ttf
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
    - family: LibreBaskerville
      fonts:
        - asset: assets/fonts/LibreBaskerville-Regular.ttf

    - family: RobotoSlab
      fonts:
        - asset: assets/fonts/RobotoSlab.ttf
    - family: Merriweather
      fonts:
