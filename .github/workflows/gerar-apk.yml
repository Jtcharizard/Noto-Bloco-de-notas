name: Gerar APK do Noto

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar fontes do aplicativo
        run: |
          mkdir -p assets/fonts
          curl -L https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Regular.ttf -o assets/fonts/Poppins-Regular.ttf
          curl -L https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Bold.ttf -o assets/fonts/Poppins-Bold.ttf

      - name: Gerar estrutura Android
        run: |
          flutter create --platforms=android .
          sed -i 's/android:label="bloco_personalizavel"/android:label="Noto"/' android/app/src/main/AndroidManifest.xml

      - name: Baixar dependencias
        run: flutter pub get

      - name: Aplicar icone do Noto
        run: dart run flutter_launcher_icons

      - name: Verificar codigo
        run: flutter analyze --no-fatal-infos

      - name: Compilar APK
        run: flutter build apk --release

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Noto-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
