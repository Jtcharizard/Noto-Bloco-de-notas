name: Verificar código (rápido)

on:
  workflow_dispatch:
  push:
    branches: ['wip/**']

jobs:
  verificar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fontes
        run: bash tools/baixar_fontes.sh
      - name: Dependências
        run: flutter pub get
      - name: Analisar
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee step.log || { grep -E "(error|warning) •" step.log | head -40 | sed 's/^/::error::/'; exit 1; }
      - name: Testes
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee step.log || { grep -E "Expected:|Actual:|EXCEPTION|Test failed|\[E\]|Error:|══╡" step.log | head -40 | sed 's/^/::error::/'; exit 1; }
